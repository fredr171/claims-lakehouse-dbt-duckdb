# Tooling config for the CCLF generator at the repo root (standard library only; not
# an installable package). The lakehouse ETL has its own pyproject.toml in
# claims-lakehouse-dbt-duckdb/.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["claims-lakehouse-dbt-duckdb"]  # linted with its own config

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
