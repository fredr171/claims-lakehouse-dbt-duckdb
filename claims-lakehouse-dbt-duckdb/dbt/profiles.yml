# Committed on purpose: it holds no secrets. AWS credentials come from the default
# credential chain (the AWS CLI profile locally), exactly like ingestion.
claims_lakehouse:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Relative to dbt/; gitignored (*.duckdb). Tests set CLAIMS_DUCKDB_PATH to a temp file.
      path: "{{ env_var('CLAIMS_DUCKDB_PATH', 'claims_lakehouse.duckdb') }}"
      threads: 4
      extensions:
        - httpfs
        - parquet
      secrets:
        - type: s3
          provider: credential_chain
          region: us-east-2
    # Transform Lambda (claims_etl/transform). The runner points CLAIMS_DUCKDB_PATH at its
    # /tmp working copy. Extensions are bundled in the package (scripts/build_lambda.py
    # --transform), never downloaded at run time; credential_chain needs the aws extension.
    lambda:
      type: duckdb
      path: "{{ env_var('CLAIMS_DUCKDB_PATH') }}"
      threads: 4
      extensions:
        - httpfs
        - parquet
        - aws
      settings:
        extension_directory: "{{ env_var('CLAIMS_DUCKDB_EXTENSION_DIR', '/var/task/duckdb_extensions') }}"
        autoinstall_known_extensions: false
        autoload_known_extensions: true
      secrets:
        - type: s3
          provider: credential_chain
          region: us-east-2
