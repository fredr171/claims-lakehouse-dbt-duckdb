# Humana MA medical claims (UB-04 and CMS-1500 in one file): one row per claim
# line per claim version. A reversal reuses CLAIM_ID with CLAIM_FREQ_CD 8.
# expected_columns copied verbatim from the header of
# HUM_MEDCLM_202301.csv (inspected 2026-11-04; identical in all 36 months).
landing_prefix: humana/ma/
file_type: medical_claim_lines

# Named groups are available to raw_key_template. Raw is partitioned by
# delivery month (from the file name), never by claim or enrollment dates.
file_name_regex: '^HUM_MEDCLM_(?P<year>\d{4})(?P<month>0[1-9]|1[0-2])\.csv$'
# Then by the file's SHA-256 ({checksum}, filled in by ingestion): every delivery keeps
# its own key, so a corrected re-send sits next to the original (immutable bronze).
raw_key_template: 'humana/ma/medical_claim_lines/delivery_month={year}-{month}/checksum={checksum}/part-0.parquet'

# A line is unique on (CLAIM_ID, CLAIM_LINE_NUM, CLAIM_FREQ_CD); MEMBER_ID ties it
# to eligibility. Uniqueness itself is a dbt staging test.
key_columns:
  - CLAIM_ID
  - CLAIM_LINE_NUM
  - CLAIM_FREQ_CD
  - MEMBER_ID

expected_columns:
  - CLAIM_ID
  - CLAIM_LINE_NUM
  - ORIG_CLAIM_ID
  - CLAIM_STATUS
  - CLAIM_FREQ_CD
  - CLAIM_FORM_TYPE
  - BILL_TYPE
  - MEMBER_ID
  - MBI
  - CONTRACT_ID
  - PBP_ID
  - SERVICE_FROM_DT
  - SERVICE_TO_DT
  - ADMIT_DT
  - DISCHARGE_DT
  - ADMIT_TYPE
  - ADMIT_SOURCE
  - DISCHARGE_STATUS
  - DRG_CD
  - LINE_FROM_DT
  - LINE_TO_DT
  - REVENUE_CD
  - PROCEDURE_CD
  - MODIFIER_1
  - UNITS
  - PLACE_OF_SERVICE
  - BILLING_NPI
  - BILLING_TIN
  - RENDERING_NPI
  - ATTENDING_NPI
  - FACILITY_CCN
  - PROVIDER_SPECIALTY
  - IN_NETWORK_FLAG
  - CAPITATED_FLAG
  - BILLED_AMT
  - ALLOWED_AMT
  - PAID_AMT
  - COPAY_AMT
  - COINSURANCE_AMT
  - DEDUCTIBLE_AMT
  - ICD_VERSION
  - DX_CODE_1
  - DX_CODE_2
  - DX_CODE_3
  - DX_CODE_4
  - DX_CODE_5
  - DX_CODE_6
