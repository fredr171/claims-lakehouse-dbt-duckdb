# CCLF5 Part B physician claim lines: one CSV per monthly delivery (1-4 lines per claim version).
# expected_columns copied verbatim from the header of
# CCLF5_202301.csv (inspected 2026-11-04; identical in all 36 months).
landing_prefix: cms/cclf/
file_type: part_b_physician_lines

# Named groups are available to raw_key_template. Raw is partitioned by
# delivery month (from the file name), never by claim dates, then by the file's
# SHA-256 ({checksum}, filled in by ingestion): every delivery keeps its own key, so a
# corrected re-send sits next to the original (immutable bronze; dbt picks the current).
file_name_regex: '^CCLF5_(?P<year>\d{4})(?P<month>0[1-9]|1[0-2])\.csv$'
raw_key_template: 'cms/cclf/part_b_physician_lines/delivery_month={year}-{month}/checksum={checksum}/part-0.parquet'

key_columns:
  - CUR_CLM_UNIQ_ID
  - CLM_LINE_NUM
  - BENE_MBI_ID

expected_columns:
  - CUR_CLM_UNIQ_ID
  - CLM_LINE_NUM
  - BENE_MBI_ID
  - BENE_HIC_NUM
  - CLM_TYPE_CD
  - CLM_FROM_DT
  - CLM_THRU_DT
  - RNDRG_PRVDR_TYPE_CD
  - RNDRG_PRVDR_FIPS_ST_CD
  - CLM_PRVDR_SPCLTY_CD
  - CLM_FED_TYPE_SRVC_CD
  - CLM_POS_CD
  - CLM_LINE_FROM_DT
  - CLM_LINE_THRU_DT
  - CLM_LINE_HCPCS_CD
  - CLM_LINE_CVRD_PD_AMT
  - CLM_LINE_PRMRY_PYR_CD
  - CLM_LINE_DGNS_CD
  - CLM_RNDRG_PRVDR_TAX_NUM
  - RNDRG_PRVDR_NPI_NUM
  - CLM_CARR_PMT_DNL_CD
  - CLM_PRCSG_IND_CD
  - CLM_ADJSMT_TYPE_CD
  - CLM_EFCTV_DT
  - CLM_IDR_LD_DT
  - CLM_CNTL_NUM
  - CLM_LINE_ALOWD_CHRG_AMT
  - CLM_LINE_SRVC_UNIT_QTY
  - HCPCS_1_MDFR_CD
  - CLM_DGNS_1_CD
  - CLM_DGNS_2_CD
  - CLM_DGNS_3_CD
  - DGNS_PRCDR_ICD_IND
