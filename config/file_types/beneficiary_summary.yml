# Beneficiary Summary File: one zip per year per sample.
# expected_columns copied verbatim from the header of
# DE1_0_2008_Beneficiary_Summary_File_Sample_1.csv (inspected 2026-11-02).
file_type: beneficiary_summary

# Named groups are available to the templates below.
zip_name_regex: '^DE1_0_(?P<year>\d{4})_Beneficiary_Summary_File_Sample_(?P<sample>\d+)\.zip$'
csv_member_template: 'DE1_0_{year}_Beneficiary_Summary_File_Sample_{sample}.csv'
raw_key_template: 'cms/desynpuf/beneficiary_summary/year={year}/sample={sample}/part-0.parquet'

key_columns:
  - DESYNPUF_ID

expected_columns:
  - DESYNPUF_ID
  - BENE_BIRTH_DT
  - BENE_DEATH_DT
  - BENE_SEX_IDENT_CD
  - BENE_RACE_CD
  - BENE_ESRD_IND
  - SP_STATE_CODE
  - BENE_COUNTY_CD
  - BENE_HI_CVRAGE_TOT_MONS
  - BENE_SMI_CVRAGE_TOT_MONS
  - BENE_HMO_CVRAGE_TOT_MONS
  - PLAN_CVRG_MOS_NUM
  - SP_ALZHDMTA
  - SP_CHF
  - SP_CHRNKIDN
  - SP_CNCR
  - SP_COPD
  - SP_DEPRESSN
  - SP_DIABETES
  - SP_ISCHMCHT
  - SP_OSTEOPRS
  - SP_RA_OA
  - SP_STRKETIA
  - MEDREIMB_IP
  - BENRES_IP
  - PPPYMT_IP
  - MEDREIMB_OP
  - BENRES_OP
  - PPPYMT_OP
  - MEDREIMB_CAR
  - BENRES_CAR
  - PPPYMT_CAR

# Observed: 3.1 MB zip, 14.6 MB CSV, ratio 4.7.
limits:
  max_zip_bytes: 104857600            # 100 MiB
  max_uncompressed_bytes: 1073741824  # 1 GiB
