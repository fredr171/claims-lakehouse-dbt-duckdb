# Quarantine notifications: quarantine/<...>.csv.error.json -> ticket.
# Tracker-agnostic on purpose: switching GitHub -> Jira changes only the client.
# Bucket names and the quarantine prefix come from ingestion.yml.

error_json_suffix: .csv.error.json
ticket_prefix: _tickets/          # in the raw bucket; one <sha256>.json per quarantined checksum

labels:
  base: [quarantine, data-quality]   # the file type is added per ticket
  match: quarantine                  # label used to look up existing OPEN tickets
  default_color: c5def5
  colors:
    quarantine: d73a4a
    data-quality: fbca04
  descriptions:
    quarantine: File quarantined by claims-etl ingestion
    data-quality: Data delivery failed a validation check
    default: "claims-etl file type"

# Placeholders: file_type, file_name, failed_check. The file name carries the
# delivery month (e.g. CCLF1_202301.csv), so no separate partition field is needed.
title_template: "[Quarantine] {file_type} {file_name}: {failed_check}"
max_title_chars: 200
max_details_chars: 500

# Placeholder: file_type. One entry per ingestion check, plus a default.
next_steps:
  known_file_type: >-
    Upload under <feed prefix><file_type>/ (e.g. cms/cclf/claims_header/ or
    humana/ma/member_eligibility/) using a folder that has a config for that feed in
    config/file_types/, or add config/file_types/<file_type>.yml for a new type.
  file_name: >-
    Rename the file to match file_name_regex in config/file_types/{file_type}.yml
    (e.g. CCLF1_YYYYMM.csv or HUM_ELIG_YYYYMM.csv, with a real month 01-12) and re-upload.
  file_size: >-
    The file is empty or above max_file_bytes. Re-export it; if the size is
    genuine, raise the limit in config/file_types/{file_type}.yml.
  csv_utf8: >-
    The CSV is not valid UTF-8. Check the source encoding (e.g. Latin-1) at the
    reported position and request a UTF-8 file.
  csv_parseable: >-
    Malformed quoting at the reported line. Inspect that line locally for stray
    or unbalanced double quotes.
  csv_header: >-
    Compare the file header with expected_columns in config/file_types/{file_type}.yml.
    If the source schema changed intentionally, update the config.
  csv_field_counts: >-
    Inspect the reported line numbers for missing or extra delimiters and
    request a corrected file.
  csv_row_count: >-
    The CSV has a header but no data rows. Confirm the export completed upstream.
  csv_key_columns: >-
    Key column values are empty at the reported lines. Request a corrected file;
    rows without keys cannot be joined downstream.
  row_count_reconciliation: >-
    CSV and Parquet row counts differ, which indicates an ingestion bug rather
    than bad data. Re-run ingestion locally with --key and investigate.
  default: >-
    Review the .error.json report linked above and the check in
    src/claims_etl/ingestion/checks.py.

# --- Pipeline alerts: transform runs and CloudWatch alarms -> GitHub issues ------------
# claims_etl/notifications/alerts.py. The same repo, client and sanitizing as quarantine.
# One OPEN issue per problem, found by the body line ``Alert key: `<key>` `` (Issues list
# endpoint filtered by match_label, like quarantine). A repeat adds a comment; recovery
# (a passed/warned run covering the feeds, or the alarm back to OK) comments and closes.
alerts:
  match_label: pipeline-alert
  record_prefix: _tickets/alerts/   # raw bucket; one record per notified event (idempotency)
  report_suffix: /report.json       # under transform.yml runs_prefix
  labels:
    pipeline-alert: {color: b60205, description: "claims-etl pipeline failure"}
    transform: {color: 5319e7, description: "Transform run (dbt build) failed or stopped"}
    stopped: {color: fbca04, description: "A STOP test blocked the intermediate models"}
    error: {color: d93f0b, description: "The build could not run"}
    alarm: {color: e99695, description: "CloudWatch alarm"}
  next_steps:
    stopped: >-
      A STOP test failed, so dbt skipped the intermediate models below it; those feeds
      stay pending (their raw checksums are not in intermediate yet). Find the failing
      rows locally from run_results.json, then fix the delivery: re-send the corrected
      file under the same name. The bad delivery stays in raw, marked superseded
      (stg_<feed>__deliveries), and staging reads only the new one. Every later build re-checks all months, so this issue closes itself on the
      first passed or warned run for these feeds.
    error: >-
      The build could not run (dbt crash, SQL error, S3 trouble or a state conflict). The
      old state was kept. SQS retries after 2, 5 and 10 minutes, then moves the batch to
      claims-etl-transform-dlq.fifo. Check /aws/lambda/claims-etl-transform for this run
      ID, fix the cause, and redrive the DLQ.
    alarms:
      claims-etl-transform-dlq-not-empty: >-
        A transform batch ran out of retries. See the open "error" issue for its runs, fix
        the cause, then redrive claims-etl-transform-dlq.fifo to claims-etl-transform.fifo.
      claims-etl-events-undelivered: >-
        EventBridge could not deliver FileIngested events to the transform queue for 24 h.
        Check the queue and its policy, then re-publish the events in
        claims-etl-transform-undelivered (the raw files are fine).
      claims-etl-events-delivery-failed: >-
        EventBridge failed to deliver a FileIngested event (it retries for 24 h). Check
        the queue policy and that the FIFO queue keeps content-based deduplication.
      claims-etl-ingest-errors: >-
        Ingestion raised (S3, network or publish trouble, not bad data: bad data is
        quarantined). The file stays in landing; check /aws/lambda/claims-etl-ingest and
        re-run with `claims-etl --scan`.
      claims-etl-transform-killed: >-
        The transform Lambda was killed (timeout or out of memory) before it could write a
        report. Check /aws/lambda/claims-etl-transform; raise memory or the timeout in
        Terraform if the build has outgrown them.
      default: >-
        Check the alarm in the CloudWatch console and the related log group.
